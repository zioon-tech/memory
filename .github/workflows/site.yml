name: Memory website and docs
on:
  pull_request:
    paths: ["apps/memory-service/web/**", "docs/**", "scripts/**", ".github/workflows/site.yml"]
  push:
    branches: [main, "migration/**"]
    paths: ["apps/memory-service/web/**", "docs/**", "scripts/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      install: node --version
      command: npm run build:site && npm run check:site
      release-component: public-site
      artifact-name: memory-public-site-${{ github.sha }}
      artifact-path: .release-out/public-site
