name: Memory CI
on:
  pull_request:
    paths-ignore: ["docs/**", "apps/memory-service/web/**"]
  push:
    branches: [main, "migration/**"]
    paths-ignore: ["docs/**", "apps/memory-service/web/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    uses: zioon-tech/workflows/.github/workflows/secret-scan.yml@0a13f954a680a4a7f03fafa7ebdb6a312e711286
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_FS_UPSTREAM_DIR: ${{ github.workspace }}/.vendor/agent-fs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - run: npm run bootstrap
      - run: npm test
      - name: Create service source artifact
        run: |
          mkdir -p dist
          git archive HEAD | gzip -n > dist/memory-source.tgz
          sha256sum dist/memory-source.tgz > dist/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-service-${{ github.sha }}
          path: |
            dist/memory-source.tgz
            dist/SHA256SUMS
            dist/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 14
